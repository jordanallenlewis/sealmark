# yaml-language-server: $schema=./node_modules/sealmark/schema/sealmark.schema.json
# sealmark.yaml
# Run:  sealmark run     Inspect:  sealmark config show --effective --origins
# note (pg): input variable(s) "pg-password" were not answered; set SEALMARK_INPUT_PG_PASSWORD in the environment or in sealmark.local.yaml
# note (data): input variable(s) "data-dir" were not answered; set SEALMARK_INPUT_DATA_DIR in the environment or in sealmark.local.yaml
# note (api): input variable(s) "pg-password" were not answered; set SEALMARK_INPUT_PG_PASSWORD in the environment or in sealmark.local.yaml
# note (pyserver): cwd is ignored: the harness starts the server in its own sandbox directory
# note (pyserver): envFile is not read: put the variables under env, or in sealmark.local.yaml

schema_version: 1
servers:
  pg:
    command: npx
    args:
      - -y
      - "@example/postgres-mcp"
    env:
      PGPASSWORD: ${SEALMARK_INPUT_PG_PASSWORD}
      PGHOST: localhost
  data:
    command: node
    args:
      - server.js
      - --dir
      - ${SEALMARK_INPUT_DATA_DIR}
  api:
    url: https://api.example.test/mcp
    headers:
      X-Api-Key: ${SEALMARK_INPUT_PG_PASSWORD}
  pyserver:
    command: python
    args:
      - -m
      - srv
