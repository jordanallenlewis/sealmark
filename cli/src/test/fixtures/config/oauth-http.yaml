# End-to-end example for the round 7 oauth toy. The toy reads its issuer, JWKS URL, audience and required
# scopes from the environment, the way a real server would; --oauth (oauth.issuer: stub) fills the placeholders and sends the harness's
# tokens as Authorization: Bearer, so no headers: entry is needed.
# The same run from the command line, with no file:
#   sealmark run --oauth --upstream --start "node dist/toy/oauth-http.js --mode good --port 8080 --backend {upstream}" --url http://127.0.0.1:8080/mcp
# (with TOY_ISSUER={issuer} and the others set in server.env, which needs this file or SEALMARK_SERVER__ENV).
schema_version: 1
name: oauth-resource-server
server:
  command: node
  args: ["dist/toy/oauth-http.js", "--mode", "good", "--port", "8080", "--backend", "{upstream}"]
  url: http://127.0.0.1:8080/mcp
  env:
    TOY_ISSUER: "{issuer}"
    TOY_JWKS_URI: "{jwks}"
    TOY_AUDIENCE: "{audience}"
    TOY_REQUIRED_SCOPES: "mcp:tools"
oauth:
  issuer: stub
  scopes: ["mcp:tools"]
upstream:
  kind: http
  default_reply: { status: 200, json: { rows: [{ id: 1 }] } }
checks:
  upstream-slow: { expected_sec: 2 }
probes:
  - { tool: lookup, args: { id: "sm-{token}" } }
