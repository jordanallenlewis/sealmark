name: publish

# Publishes the `sealmark` npm package when cli/package.json names a version that is not on npm yet.
# Tokenless: npm Trusted Publishing (OIDC). No npm token is stored in this repo or on a laptop.
#
# ONE-TIME SETUP (after the first manual publish, because npm only lets an existing package trust a workflow):
#   npmjs.com -> package "sealmark" -> Settings -> Trusted Publisher -> GitHub Actions:
#     Organization or user: jordanallenlewis   Repository: sealmark   Workflow filename: publish.yml
# Provenance attestations are added automatically when the repository is public; a private repository still publishes.

# Publish-on-push is on again (owner, 2026-10-15): a push to main that touches cli/** or this file publishes
# cli/package.json's version when it is not on npm yet, after typecheck and tests pass. Bump the version to release.
# Manual runs still work: Actions tab -> publish -> Run workflow.
on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-sealmark
  cancel-in-progress: false

jobs:
  check:
    name: is this version already on npm?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          VERSION=$(node -p "require('./cli/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "sealmark@$VERSION" version >/dev/null 2>&1; then
            echo "sealmark@$VERSION is already on npm: nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "sealmark@$VERSION is new: it will be tested and published"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: typecheck and tests
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install
        working-directory: cli
        run: npm ci
      - name: Typecheck
        working-directory: cli
        run: npm run typecheck
      - name: Tests
        working-directory: cli
        run: npm test

  publish:
    name: publish to npm
    timeout-minutes: 60
    needs: [check, test]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        working-directory: cli
        run: npm ci
      - name: Publish (tokenless via OIDC)
        working-directory: cli
        run: npm publish --access public
      # npm holds a new version in "Validating" (automated review) and returns 404 for it until review ends.
      # Wait for the version to become visible, and FAIL if it never does, so a green run means installable.
      # Do not re-run the whole workflow while it is validating: `check` still sees a 404 and would publish again.
      - name: Wait for npm validation to finish
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          DEADLINE=$(( $(date +%s) + 45 * 60 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if npm view "sealmark@$VERSION" version 2>/dev/null; then
              echo "sealmark@$VERSION is live"
              exit 0
            fi
            echo "sealmark@$VERSION not visible yet (npm is still validating it); checking again in 30s"
            sleep 30
          done
          echo "::error::sealmark@$VERSION was published but npm had not finished validating it after 45 minutes. It is NOT installable yet. Check https://www.npmjs.com/package/sealmark and your npm email; do not re-run this workflow."
          exit 1

  # The website must follow the release (Jordan, 2026-11-09). The sealmark-site `release-sync` workflow pins the new version,
  # updates the docs and changelog, deploys sealmark.dev and checks it. Here we ask it to start now (only if the optional
  # SITE_DISPATCH_TOKEN secret exists: a token that can send repository_dispatch to sealmark-site) and then WAIT until the
  # live site shows the new version. This job is red when the site does not follow within 60 minutes, so a green publish run
  # means the CLI and the site agree. Without the token the site's own 30-minute poll does the update.
  site:
    name: sealmark.dev shows the new version
    needs: [check, publish]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: ask sealmark-site to ship it now (optional)
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "no SITE_DISPATCH_TOKEN: relying on the site's 30-minute poll"; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jordanallenlewis/sealmark-site/dispatches \
            -d "{\"event_type\":\"sealmark-release\",\"client_payload\":{\"version\":\"$VERSION\"}}"
      - name: wait for the live site
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          DEADLINE=$(( $(date +%s) + 60 * 60 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            LIVE=$(curl -fsS "https://sealmark.dev/docs/?t=$(date +%s)" | grep -o 'Sealmark [0-9][0-9.]*, methodology' | head -1 | grep -o '[0-9][0-9.]*[0-9]' | head -1 || true)
            if [ "$LIVE" = "$VERSION" ]; then echo "sealmark.dev shows sealmark@$VERSION"; exit 0; fi
            echo "sealmark.dev shows '${LIVE:-nothing}', waiting for $VERSION"
            sleep 60
          done
          echo "::error::sealmark@$VERSION is on npm but sealmark.dev did not show it within 60 minutes. Check the release-sync workflow in jordanallenlewis/sealmark-site (Actions tab) and re-run it."
          exit 1

  github-packages:
    # a mirror for the repository and profile pages; npm above stays the install source. Re-running is a no-op.
    name: mirror to GitHub Packages
    needs: [check, publish]
    if: needs.check.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/github-packages.yml
    with:
      ref: ${{ github.sha }}
